name: Build and Release Installer

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.5.0

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Update Project Version
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        (Get-Content Sources/SmartTaskbar/SmartTaskbar++.csproj) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content Sources/SmartTaskbar/SmartTaskbar++.csproj
      shell: pwsh

    - name: Publish SmartTaskbar++ (Lite)
      run: |
        dotnet publish Sources/SmartTaskbar/SmartTaskbar++.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish_lite

    - name: Build Installer (Inno Setup)
      run: |
        iscc /DMyAppVersion=${{ github.ref_name }} installer.iss

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          publish_lite/SmartTaskbar++.exe
          SmartTaskbar_*_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
